name: Build Result image

on:
  push:
    branches: ['qa']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3


      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        run: docker build . -f Dockerfile --tag ${{ secrets.DOCKER_USERNAME }}/advansed_web_task_3

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/advansed_web_task_3



      - name: SSH into EC2 instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/advansed_web_task_3
            sudo docker stop web_task
            sudo docker rm web_task

            sudo docker run -d -p 8000:8000 --name web_task ${{ secrets.DOCKER_USERNAME }}/advansed_web_task_3
            